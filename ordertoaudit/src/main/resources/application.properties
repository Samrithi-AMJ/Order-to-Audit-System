# Server Port
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ordertoaudit_dev?serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Benchmark execution is opt-in and additionally restricted to demo/test H2 databases.
app.benchmark.enabled=${BENCHMARK_ENABLED:false}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Company GST Details (for Invoicing)
app.company.name=Sam's Shop
app.company.address=Bhavani, Erode
app.company.gstin=33AABCS1429B1Z8
app.company.state=Tamil Nadu
app.company.state-code=33

# Logging
logging.level.com.nittrichy.ordertoaudit=INFO
logging.level.org.springframework.security=WARN
